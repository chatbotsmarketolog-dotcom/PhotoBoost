<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Личный кабинет — PhotoBoost PRO</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a1a;
    color: #f8fafc;
    min-height: 100vh;
    padding: 40px 20px;
}
.container { max-width: 1200px; margin: 0 auto; }
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}
.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.4rem;
    font-weight: 800;
    text-decoration: none;
    color: #f8fafc;
}
.user-info {
    display: flex;
    align-items: center;
    gap: 15px;
}
.user-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7c3aed, #ec4899);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
}
.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
    border-bottom: 2px solid rgba(255,255,255,0.1);
}
.tab {
    padding: 12px 24px;
    background: none;
    border: none;
    color: #94a3b8;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
}
.tab.active {
    color: #7c3aed;
    border-bottom-color: #7c3aed;
}
.tab-content { display: none; }
.tab-content.active { display: block; }
.card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 20px;
}
.upload-zone {
    border: 2px dashed rgba(255,255,255,0.2);
    border-radius: 16px;
    padding: 60px 40px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
}
.upload-zone:hover {
    border-color: #7c3aed;
    background: rgba(124, 58, 237, 0.05);
}
.btn {
    padding: 12px 24px;
    border-radius: 10px;
    border: none;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
}
.btn-primary {
    background: linear-gradient(135deg, #7c3aed, #ec4899);
    color: white;
}
.btn-danger {
    background: #ef4444;
    color: white;
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <a href="index.html" class="logo">
            <div style="width:38px;height:38px;background:linear-gradient(135deg,#7c3aed,#ec4899);border-radius:10px;display:flex;align-items:center;justify-content:center;">📸</div>
            <div>Photo<span style="background:linear-gradient(135deg,#7c3aed,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Boost</span></div>
        </a>
        <div class="user-info">
            <span id="userName">Пользователь</span>
            <div class="user-avatar" id="userAvatar">П</div>
            <button class="btn btn-danger" onclick="logout()">Выйти</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('convert')">️ Конвертация</button>
        <button class="tab" onclick="switchTab('subscription')">📋 Подписка</button>
        <button class="tab" onclick="switchTab('history')">📜 История</button>
    </div>

    <div id="tab-convert" class="tab-content active">
        <div class="card">
            <div class="upload-zone" id="dashboardUploadZone">
                <div style="font-size:3rem;margin-bottom:16px;"></div>
                <h3 style="margin-bottom:8px;">Перетащите фото сюда</h3>
                <p style="color:#94a3b8;">или нажмите для выбора</p>
                <input type="file" id="dashboardFileInput" accept="image/*" multiple style="display:none;">
            </div>
        </div>
    </div>

    <div id="tab-subscription" class="tab-content">
        <div class="card">
            <h3 style="margin-bottom:20px;">Ваша подписка</h3>
            <div id="subscriptionInfo">Загрузка...</div>
        </div>
    </div>

    <div id="tab-history" class="tab-content">
        <div class="card">
            <h3 style="margin-bottom:20px;">История обработок</h3>
            <div id="historyList">История пуста</div>
        </div>
    </div>
</div>

<script>
// Загрузка данных пользователя
const user = JSON.parse(localStorage.getItem('pbUser'));
if (!user) { window.location.href = 'index.html'; }

document.getElementById('userName').textContent = user.name;
document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();

// Переключение вкладок
function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
}

// Выход
function logout() {
    localStorage.removeItem('pbUser');
    window.location.href = 'index.html';
}

// Загрузка подписки
const isPro = localStorage.getItem('pbIsPro') === 'true';
const proExpiry = localStorage.getItem('pbProExpiry');
document.getElementById('subscriptionInfo').innerHTML = isPro 
    ? `<div style="color:#10b981;font-size:1.2rem;font-weight:700;">✅ PRO активна до ${new Date(proExpiry).toLocaleDateString('ru-RU')}</div>`
    : `<div style="color:#fbbf24;font-size:1.2rem;font-weight:700;">🆓 Бесплатный тариф</div><button class="btn btn-primary" style="margin-top:16px;" onclick="window.location.href='index.html#pricing'">Активировать PRO</button>`;

// Загрузка истории
const history = JSON.parse(localStorage.getItem('pbHistory') || '[]');
document.getElementById('historyList').innerHTML = history.length 
    ? history.map(h => `<div style="padding:12px;border-bottom:1px solid rgba(255,255,255,0.1);">${h.name} <span style="color:#94a3b8;font-size:0.9rem;">(${new Date(h.date).toLocaleDateString('ru-RU')})</span></div>`).join('')
    : 'История пуста';
</script>
</body>
</html>
