<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель — PhotoBoost</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { 
  --bg-dark: #0a0a1a; --bg-card: #12122a; --primary: #7c3aed; --gold: #fbbf24; 
  --success: #10b981; --danger: #ef4444; --text-light: #f8fafc; --text-muted: #94a3b8; --border: rgba(255,255,255,0.1);
}
body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-light); line-height: 1.6; padding: 20px; }
.container { max-width: 1200px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
header h1 { font-size: 1.8rem; color: var(--gold); }
.logout-btn { background: var(--danger); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }

/* Вкладки */
.dash-tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 2px solid var(--border); }
.dash-tab { padding: 12px 20px; background: none; border: none; border-bottom: 3px solid transparent; cursor: pointer; font-weight: 600; font-size: 0.95rem; color: var(--text-muted); font-family: inherit; margin-bottom: -2px; }
.dash-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.dash-tab-content { display: none; }
.dash-tab-content.active { display: block; }

.card { background: var(--bg-card); border-radius: 16px; padding: 24px; margin-bottom: 20px; border: 1px solid var(--border); }
.card h3 { margin-bottom: 20px; font-size: 1.2rem; }

/* Таблица пользователей */
.table-wrapper { overflow-x: auto; }
.users-table { width: 100%; border-collapse: collapse; min-width: 600px; }
.users-table th, .users-table td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); }
.users-table th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; }
.users-table td { font-size: 0.95rem; }

/* Бейджи статусов */
.badge { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; display: inline-block; }
.badge-pro { background: rgba(251, 191, 36, 0.15); color: var(--gold); border: 1px solid rgba(251, 191, 36, 0.3); }
.badge-free { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); border: 1px solid rgba(148, 163, 184, 0.3); }

/* Период подписки */
.period-text { font-size: 0.9rem; color: var(--text-light); }
.period-text.free { color: var(--text-muted); font-style: italic; }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🔧 Админ-панель PhotoBoost</h1>
    <button class="logout-btn" onclick="handleLogout()">Выйти</button>
  </header>

  <div class="dash-tabs">
    <button class="dash-tab active" onclick="switchTab('users', this)">👥 Пользователи</button>
    <button class="dash-tab" onclick="switchTab('codes', this)">🔑 Коды активации</button>
  </div>

  <!-- ВКЛАДКА ПОЛЬЗОВАТЕЛИ -->
  <div class="dash-tab-content active" id="tab-users">
    <div class="card">
      <h3>Список всех пользователей</h3>
      <div class="table-wrapper">
        <table class="users-table">
          <thead>
            <tr>
              <th>Имя</th>
              <th>Email</th>
              <th>Статус</th>
              <th>Период подписки</th>
              <th>Дата регистрации</th>
            </tr>
          </thead>
          <tbody id="adminUsersTableBody">
            <!-- Заполняется через JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ВКЛАДКА КОДЫ -->
  <div class="dash-tab-content" id="tab-codes">
    <div class="card">
      <h3>Управление кодами активации</h3>
      <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <input type="text" id="newCodeInput" placeholder="WB-XXXX-XXXX" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-dark); color: white;">
        <button class="logout-btn" style="background: var(--primary);" onclick="addManualCode()">Добавить код</button>
        <button class="logout-btn" style="background: var(--success);" onclick="generateRandomCode()">Сгенерировать</button>
      </div>
      <div id="codesList"></div>
    </div>
  </div>
</div>

<script>
// ===== ПРОВЕРКА ВХОДА =====
if (!localStorage.getItem('isAdmin')) {
  // Простая проверка для демо. В реальности можно сделать вход по паролю
  const pass = prompt('Введите пароль администратора:');
  if (pass === 'admin123') { // ИЗМЕНИ ПАРОЛЬ ЗДЕСЬ
    localStorage.setItem('isAdmin', 'true');
  } else {
    alert('Неверный пароль');
    window.location.href = '../'; // Возврат на главную
  }
}

function handleLogout() {
  localStorage.removeItem('isAdmin');
  window.location.href = '../';
}

// ===== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК =====
function switchTab(tabName, btn) {
  document.querySelectorAll('.dash-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.dash-tab-content').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + tabName).classList.add('active');
  
  if (tabName === 'users') renderUsers();
  if (tabName === 'codes') renderCodes();
}

// ===== РЕНДЕР ПОЛЬЗОВАТЕЛЕЙ (С ДАТАМИ И СТАТУСОМ) =====
function renderUsers() {
  const users = JSON.parse(localStorage.getItem('pbUsers') || '[]');
  const tbody = document.getElementById('adminUsersTableBody');
  
  if (users.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Пользователей пока нет</td></tr>';
    return;
  }

  tbody.innerHTML = users.map(user => {
    // Получаем данные конкретного пользователя
    const data = JSON.parse(localStorage.getItem('pbData_' + user.email) || '{}');
    const isPro = data.isPro;
    const regDate = new Date(user.registeredAt).toLocaleDateString('ru-RU');
    
    let periodHtml = '<span class="period-text free">Нет активной подписки</span>';
    
    if (isPro && data.proExpiry) {
      // Вычисляем дату начала (минус 1 месяц от даты окончания)
      const endDate = new Date(data.proExpiry);
      const startDate = new Date(endDate);
      startDate.setMonth(startDate.getMonth() - 1);
      
      const startStr = startDate.toLocaleDateString('ru-RU');
      const endStr = endDate.toLocaleDateString('ru-RU');
      
      periodHtml = `<span class="period-text">с <strong>${startStr}</strong> по <strong>${endStr}</strong></span>`;
    }

    const statusBadge = isPro 
      ? '<span class="badge badge-pro">PRO</span>' 
      : '<span class="badge badge-free">Free</span>';

    return `
      <tr>
        <td>${user.name}</td>
        <td>${user.email}</td>
        <td>${statusBadge}</td>
        <td>${periodHtml}</td>
        <td>${regDate}</td>
      </tr>
    `;
  }).join('');
}

// ===== УПРАВЛЕНИЕ КОДАМИ =====
function renderCodes() {
  const codes = JSON.parse(localStorage.getItem('pbValidCodes') || '[]');
  const list = document.getElementById('codesList');
  
  if (codes.length === 0) {
    list.innerHTML = '<p class="empty-state">Нет активных кодов</p>';
    return;
  }

  list.innerHTML = codes.map((code, index) => `
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg-dark); border-radius: 8px; margin-bottom: 8px;">
      <code style="font-family: monospace; font-size: 1.1rem; color: var(--gold); font-weight: 700;">${code}</code>
      <button class="logout-btn" style="background: var(--danger); padding: 6px 12px; font-size: 0.8rem;" onclick="deleteCode(${index})">Удалить</button>
    </div>
  `).join('');
}

function generateRandomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = 'WB-';
  for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
  code += '-';
  for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
  
  const codes = JSON.parse(localStorage.getItem('pbValidCodes') || '[]');
  codes.push(code);
  localStorage.setItem('pbValidCodes', JSON.stringify(codes));
  renderCodes();
  alert('Код добавлен: ' + code);
}

function addManualCode() {
  const input = document.getElementById('newCodeInput');
  const code = input.value.trim().toUpperCase();
  if (!code || !code.startsWith('WB-')) {
    alert('Неверный формат. Должен начинаться с WB-');
    return;
  }
  const codes = JSON.parse(localStorage.getItem('pbValidCodes') || '[]');
  if (codes.includes(code)) {
    alert('Такой код уже существует');
    return;
  }
  codes.push(code);
  localStorage.setItem('pbValidCodes', JSON.stringify(codes));
  input.value = '';
  renderCodes();
}

function deleteCode(index) {
  if (!confirm('Удалить этот код?')) return;
  const codes = JSON.parse(localStorage.getItem('pbValidCodes') || '[]');
  codes.splice(index, 1);
  localStorage.setItem('pbValidCodes', JSON.stringify(codes));
  renderCodes();
}

// Инициализация при загрузке
renderUsers();
</script>
</body>
</html>
