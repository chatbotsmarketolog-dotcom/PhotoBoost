<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — PhotoBoost</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --bg-dark: #0f172a; --bg-card: #1e293b; --primary: #7c3aed; --gold: #fbbf24; --success: #10b981; --danger: #ef4444; --text-light: #f8fafc; --text-muted: #94a3b8; --border: #334155; }
body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-light); line-height: 1.6; padding: 20px; }
.container { max-width: 1200px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 2px solid var(--border); }
header h1 { font-size: 2rem; color: var(--gold); }
.logout-btn { background: var(--danger); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
.stat-card { background: var(--bg-card); padding: 24px; border-radius: 16px; border: 1px solid var(--border); }
.stat-card h3 { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 8px; text-transform: uppercase; }
.stat-card .value { font-size: 2.5rem; font-weight: 800; color: var(--gold); }
.section { background: var(--bg-card); border-radius: 16px; padding: 30px; margin-bottom: 30px; border: 1px solid var(--border); }
.section h2 { margin-bottom: 20px; color: var(--gold); font-size: 1.5rem; }
.code-generator { display: grid; gap: 16px; }
.code-generator label { font-weight: 600; }
.code-generator input, .code-generator select { padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-dark); color: var(--text-light); font-size: 1rem; }
.generate-btn { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 1rem; }
.generate-btn:hover { opacity: 0.9; }
.codes-list { margin-top: 20px; }
.code-item { background: var(--bg-dark); padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--success); }
.code-item.used { border-left-color: var(--danger); opacity: 0.6; }
.code-item code { font-family: 'Courier New', monospace; font-size: 1.1rem; font-weight: 700; color: var(--gold); }
.copy-btn { background: var(--bg-card); color: var(--text-light); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
.users-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
.users-table th, .users-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
.users-table th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.85rem; }
.badge { padding: 4px 12px; border-radius: 50px; font-size: 0.85rem; font-weight: 600; }
.badge-pro { background: rgba(251, 191, 36, 0.2); color: var(--gold); }
.badge-free { background: rgba(148, 163, 184, 0.2); color: var(--text-muted); }
.alert { padding: 16px; border-radius: 8px; margin-bottom: 20px; }
.alert-success { background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success); color: var(--success); }
.alert-error { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); }
@media (max-width: 768px) { .stats-grid { grid-template-columns: 1fr; } .users-table { font-size: 0.9rem; } }
</style>
</head>
<body>
<div class="container">
<header>
<h1>🔧 Admin Panel</h1>
<button class="logout-btn" onclick="logout()">Выйти</button>
</header>

<div id="alert"></div>

<!-- СТАТИСТИКА -->
<div class="stats-grid">
<div class="stat-card">
<h3>Всего пользователей</h3>
<div class="value" id="totalUsers">0</div>
</div>
<div class="stat-card">
<h3>PRO подписки</h3>
<div class="value" id="totalPro">0</div>
</div>
<div class="stat-card">
<h3>Сгенерировано кодов</h3>
<div class="value" id="totalCodes">0</div>
</div>
<div class="stat-card">
<h3>Активных кодов</h3>
<div class="value" id="activeCodes">0</div>
</div>
</div>

<!-- ГЕНЕРАТОР КОДОВ -->
<div class="section">
<h2>Генератор активационных кодов</h2>
<div class="code-generator">
<div>
<label>Количество кодов:</label>
<input type="number" id="codeCount" value="10" min="1" max="100">
</div>
<div>
<label>Префикс:</label>
<input type="text" id="codePrefix" value="WB" maxlength="4">
</div>
<button class="generate-btn" onclick="generateCodes()">Сгенерировать коды</button>
</div>
<div class="codes-list" id="codesList"></div>
</div>

<!-- СПИСОК ПОЛЬЗОВАТЕЛЕЙ -->
<div class="section">
<h2>👥 Пользователи</h2>
<table class="users-table">
<thead>
<tr>
<th>Email</th>
<th>Имя</th>
<th>Статус</th>
<th>PRO до</th>
<th>Обработано</th>
<th>Дата регистрации</th>
</tr>
</thead>
<tbody id="usersTable"></tbody>
</table>
</div>

<!-- УПРАВЛЕНИЕ -->
<div class="section">
<h2>⚙️ Управление</h2>
<button class="generate-btn" onclick="clearAllData()" style="background: var(--danger); margin-right: 10px;">🗑️ Очистить все данные</button>
<button class="generate-btn" onclick="exportData()">📥 Экспорт данных</button>
</div>
</div>

<script>
// ===== ПРОВЕРКА ДОСТУПА =====
const ADMIN_PASSWORD = 'PhotoBoost2024'; // ИЗМЕНИ НА СВОЙ ПАРОЛЬ!

function checkAuth() {
    const saved = localStorage.getItem('adminAuth');
    if (saved !== 'true') {
        const pass = prompt('🔐 Введите пароль администратора:');
        if (pass === ADMIN_PASSWORD) {
            localStorage.setItem('adminAuth', 'true');
        } else {
            alert('Неверный пароль!');
            location.href = './';
        }
    }
}

function logout() {
    localStorage.removeItem('adminAuth');
    location.reload();
}

// ===== СТАТИСТИКА =====
function updateStats() {
    const users = JSON.parse(localStorage.getItem('pbUsers') || '[]');
    const activeCodes = JSON.parse(localStorage.getItem('pbValidCodes') || '[]');

    let totalPro = 0;
    users.forEach(u => {
        const data = JSON.parse(localStorage.getItem('pbData_' + u.email) || '{}');
        if (data.isPro) totalPro++;
    });

    document.getElementById('totalUsers').textContent = users.length;
    document.getElementById('totalPro').textContent = totalPro;
    document.getElementById('totalCodes').textContent = activeCodes.length;
    document.getElementById('activeCodes').textContent = activeCodes.length;
}

// ===== ГЕНЕРАТОР КОДОВ =====
function generateCodes() {
    const count = parseInt(document.getElementById('codeCount').value) || 10;
    const prefix = document.getElementById('codePrefix').value || 'WB';
    const newCodes = [];

    for (let i = 0; i < count; i++) {
        const part1 = Math.random().toString(36).substring(2, 6).toUpperCase();
        const part2 = Math.random().toString(36).substring(2, 6).toUpperCase();
        newCodes.push(`${prefix}-${part1}-${part2}`);
    }

    // Сохраняем в localStorage (добавляем к существующим)
    const existing = JSON.parse(localStorage.getItem('pbValidCodes') || '[]');
    localStorage.setItem('pbValidCodes', JSON.stringify([...existing, ...newCodes]));

    // Показываем обновленный список
    renderCodesList();
    showAlert(`✅ Сгенерировано ${count} кодов!`, 'success');
    updateStats();
}

// ===== ОТРИСОВКА СПИСКА КОДОВ (ИСПРАВЛЕНИЕ: загружает коды при старте) =====
function renderCodesList() {
    const activeCodes = JSON.parse(localStorage.getItem('pbValidCodes') || '[]');
    const list = document.getElementById('codesList');
    
    if (!Array.isArray(activeCodes) || activeCodes.length === 0) {
        list.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 12px;">Нет активных кодов. Сгенерируйте новые.</p>';
        return;
    }

    list.innerHTML = '<h3 style="margin-bottom: 12px;">Активные коды:</h3>' + 
        activeCodes.map(c => `<div class="code-item"><code>${c}</code><button class="copy-btn" onclick="copyCode('${c}')">Копировать</button></div>`).join('');
}

function copyCode(code) {
    navigator.clipboard.writeText(code);
    showAlert('Код скопирован!', 'success');
}

// ===== СПИСОК ПОЛЬЗОВАТЕЛЕЙ =====
function renderUsers() {
    const users = JSON.parse(localStorage.getItem('pbUsers') || '[]');
    const tbody = document.getElementById('usersTable');

    if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Нет пользователей</td></tr>';
        return;
    }

    tbody.innerHTML = users.map(u => {
        const data = JSON.parse(localStorage.getItem('pbData_' + u.email) || '{}');
        const isPro = data.isPro;
        const proExpiry = data.proExpiry ? new Date(data.proExpiry).toLocaleDateString('ru-RU') : '—';
        const processed = data.totalProcessed || 0;
        const registered = new Date(u.registeredAt).toLocaleDateString('ru-RU');

        return `<tr>
            <td>${u.email}</td>
            <td>${u.name}</td>
            <td><span class="badge ${isPro ? 'badge-pro' : 'badge-free'}">${isPro ? 'PRO' : 'Free'}</span></td>
            <td>${proExpiry}</td>
            <td>${processed}</td>
            <td>${registered}</td>
        </tr>`;
    }).join('');
}

// ===== УПРАВЛЕНИЕ =====
function clearAllData() {
    if (confirm('⚠️ ВНИМАНИЕ! Это удалит ВСЕ данные:\n- Всех пользователей\n- Все коды\n- Всю историю\n\nПродолжить?')) {
        localStorage.clear();
        showAlert('Все данные удалены!', 'success');
        setTimeout(() => location.reload(), 1000);
    }
}

function exportData() {
    const data = {
        users: JSON.parse(localStorage.getItem('pbUsers') || '[]'),
        validCodes: JSON.parse(localStorage.getItem('pbValidCodes') || '[]'),
        reviews: JSON.parse(localStorage.getItem('pbUserReviews') || '[]'),
        exportedAt: new Date().toISOString()
    };

    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `photoboost-backup-${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    showAlert('Данные экспортированы!', 'success');
}

// ===== УВЕДОМЛЕНИЯ =====
function showAlert(msg, type) {
    const alert = document.getElementById('alert');
    alert.className = `alert alert-${type}`;
    alert.textContent = msg;
    setTimeout(() => alert.textContent = '', 3000);
}

// ===== ЗАПУСК =====
checkAuth();
updateStats();
renderUsers();
renderCodesList(); // <--- ВОТ ГЛАВНОЕ ИСПРАВЛЕНИЕ: список кодов теперь загружается сразу при открытии страницы
</script>
</body>
</html>
