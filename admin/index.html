<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель — PhotoBoost</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a1a; color: #f8fafc; padding: 40px 20px; }
.container { max-width: 1000px; margin: 0 auto; }
h1 { font-size: 2rem; margin-bottom: 30px; }
h2 { font-size: 1.3rem; margin: 30px 0 16px; }

/* ВКЛАДКИ */
.tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.1); flex-wrap: wrap; }
.tab-btn { padding: 12px 20px; background: none; border: none; color: #94a3b8; cursor: pointer; font-weight: 600; font-size: 0.95rem; border-bottom: 2px solid transparent; transition: all 0.3s; }
.tab-btn.active { color: #fbbf24; border-bottom-color: #fbbf24; }
.tab-btn:hover { color: #f8fafc; }
.tab-content { display: none; }
.tab-content.active { display: block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

/* КАРТОЧКИ И ТАБЛИЦЫ */
.card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
.generate-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.generate-row input { width: 100px; padding: 12px; border: 2px solid rgba(255,255,255,0.2); border-radius: 10px; background: rgba(255,255,255,0.05); color: white; font-size: 1rem; }
.btn { padding: 12px 24px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; font-size: 0.95rem; font-family: inherit; transition: all 0.2s; }
.btn-primary { background: #7c3aed; color: white; }
.btn-primary:hover { background: #6d28d9; }
.btn-danger { background: #ef4444; color: white; }
.btn-danger:hover { background: #dc2626; }

table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
th { color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
td { font-size: 0.95rem; }
.badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
.badge-pro { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }
.badge-free { background: rgba(100, 116, 139, 0.2); color: #94a3b8; }

/* СПИСОК КОДОВ */
.code-list { margin-top: 20px; max-height: 400px; overflow-y: auto; }
.code-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: rgba(255,255,255,0.03); border-radius: 10px; margin-bottom: 8px; }
.code-item.used { opacity: 0.6; }
.code-item code { font-family: monospace; font-size: 1.1rem; color: #10b981; }
.code-item.used code { color: #64748b; text-decoration: line-through; }
.status-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
.status-active { background: rgba(16,185,129,0.2); color: #10b981; }
.status-used { background: rgba(100,116,139,0.2); color: #64748b; }

/* СТАТИСТИКА */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
.stat-value { font-size: 2rem; font-weight: 800; color: #fbbf24; }
.stat-label { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }

@media (max-width: 640px) { 
    .generate-row { flex-direction: column; align-items: stretch; } 
    .generate-row input { width: 100%; } 
    .stats { grid-template-columns: 1fr 1fr; }
    table { font-size: 0.85rem; }
    th, td { padding: 10px 8px; }
}
</style>
</head>
<body>
<div class="container">
    <h1>🔐 Админ-панель PhotoBoost</h1>

    <!-- Общая статистика -->
    <div class="stats">
        <div class="stat"><div class="stat-value" id="statTotalUsers">0</div><div class="stat-label">Всего пользователей</div></div>
        <div class="stat"><div class="stat-value" id="statProUsers">0</div><div class="stat-label">Оплатили (PRO)</div></div>
        <div class="stat"><div class="stat-value" id="statTotalCodes">0</div><div class="stat-label">Всего кодов</div></div>
        <div class="stat"><div class="stat-value" id="statActiveCodes">0</div><div class="stat-label">Активных кодов</div></div>
   6</div>
    </div>

    <!-- ВКЛАДКИ -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('codes')">🔑 Коды</button>
        <button class="tab-btn" onclick="switchTab('users')">👥 Все пользователи</button>
        <button class="tab-btn" onclick="switchTab('paid')">💎 Оплатили (PRO)</button>
    </div>

    <!-- ВКЛАДКА 1: КОДЫ -->
    <div id="tab-codes" class="tab-content active">
        <div class="card">
            <h2>➕ Генерация кодов</h2>
            <div class="generate-row">
                <input type="number" id="codeCount" value="10" min="1" max="100" placeholder="Кол-во">
                <button class="btn btn-primary" onclick="generateCodes()">Сгенерировать</button>
                <button class="btn btn-danger" onclick="clearAllCodes()">Очистить все</button>
            </div>
            <div class="code-list" id="codeList"></div>
        </div>
</div>

    <!-- ВКЛАДКА 2: ВСЕ ПОЛЬЗОВАТЕЛИ -->
    <div id="tab-users" class="tab-content">
        <div class="card">
            <h2>👥 Список всех зарегистрированных</h2>
            <table>
                <thead>
                    <tr>
                        <th>Имя</th>
                        <th>Email</th>
                        <th>Дата регистрации</th>
                        <th>Статус</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr><td colspan="4" style="text-align:center; padding: 20px;">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ВКЛАДКА 3: ОПЛАТИЛИ -->
    <div id="tab-paid" class="tab-content">
        <div class="card">
            <h2>💎 Пользователи с активной PRO-подпиской</h2>
            <table>
                <thead>
                    <tr>
                        <th>Имя</th>
                        <th>Email</th>
                        <th>Дата активации / регистрации</th>
                        <th>Статус</div>
</div>

<script>
// ===== УПРАВЛЕНИЕ ВКЛАДКАМИ =====
function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    // Находим кнопку по тексту/онклику и делаем активной (простой способ)
    const buttons = document.querySelectorAll('.tab-btn');
    if (tabName === 'codes') buttons[0].classList.add('active');
    if (tabName === 'users') buttons[1].classList.add('active');
    if (tabName === 'paid') buttons[2].classList.add('active');
    
    document.getElementById('tab-' + tabName).classList.add('active');
    
    // Перерисовываем таблицы при переключении, чтобы данные были свежими
    if (tabName === 'users') renderUsersTable(false);
    if (tabName === 'paid') renderUsersTable(true);
}

// ===== РАБОТА С КОДАМИ =====
function getCodes() { return JSON.parse(localStorage.getItem('pbValidCodes') || '[]'); }
function saveCodes(codes) { localStorage.setItem('pbValidCodes', JSON.stringify(codes)); }

function generateCodeString() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = 'WB-';
    for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
    code += '-';
    for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
    return code;
}

function generateCodes() {
    const count = parseInt(document.getElementById('codeCount').value) || 10;
    const codes = getCodes();
    for (let i = 0; i < count; i++) {
        codes.push({ code: generateCodeString(), status: 'active', usedBy: null, usedAt: null, createdAt: new Date().toISOString() });
    }
    saveCodes(codes);
    renderCodes();
    updateStats();
    alert('✅ Сгенерировано ' + count + ' кодов');
}

function clearAllCodes() {
    if (!confirm('Удалить ВСЕ коды? Это действие нельзя отменить.')) return;
    localStorage.removeItem('pbValidCodes');
    renderCodes();
    updateStats();
}

function renderCodes() {
    const codes = getCodes();
    const list = document.getElementById('codeList');
    if (codes.length === 0) {
        list.innerHTML = '<p style="color: #64748b; text-align: center; padding: 20px;">Нет сгенерированных кодов</p>';
        return;
    }
    list.innerHTML = codes.map((c, i) => `
        <div class="code-item ${c.status === 'used' ? 'used' : ''}">
            <code>${c.code}</code>
            <span class="status-badge ${c.status === 'active' ? 'status-active' : 'status-used'}">
                ${c.status === 'active' ? 'Активен' : 'Использован'}
            </span>
            <button class="btn btn-danger" style="padding: 6px 12px; font-size: 0.8rem;" onclick="deleteCode(${i})">Удалить</button>
        </div>
    `).join('');
}

function deleteCode(index) {
    if (!confirm('Удалить этот код?')) return;
    const codes = getCodes();
    codes.splice(index, 1);
    saveCodes(codes);
    renderCodes();
    updateStats();
}

// ===== РАБОТА С ПОЛЬЗОВАТЕЛЯМИ =====
function getAllUsersData() {
    const users = JSON.parse(localStorage.getItem('pbUsers') || '[]');
    return users.map(user => {
        // Получаем данные конкретного пользователя из его хранилища
        const userData = JSON.parse(localStorage.getItem('pbData_' + user.email) || '{}');
        return { ...user, userData: userData };
    });
}

function renderUsersTable(showOnlyPro = false) {
    const allUsers = getAllUsersData();
    const targetUsers = showOnlyPro ? allUsers.filter(u => u.userData.isPro) : allUsers;
    const tbody = document.getElementById(showOnlyPro ? 'paidTableBody' : 'usersTableBody');

    if (targetUsers.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 20px; color: #94a3b8;">${showOnlyPro ? 'Пока никто не оплатил PRO' : 'Нет зарегистрированных пользователей'}</td></tr>`;
        return;
    }

    tbody.innerHTML = targetUsers.map(u => {
        const regDate = u.userData.registeredAt ? new Date(u.userData.registeredAt).toLocaleDateString('ru-RU') : '—';
        const isPro = u.userData.isPro;
        return `
            <tr>
                <td>${u.name || '—'}</td>
                <td>${u.email}</td>
                <td>${regDate}</td>
                <td><span class="badge ${isPro ? 'badge-pro' : 'badge-free'}">${isPro ? 'PRO' : 'Free'}</span></td>
            </tr>
        `;
    }).join('');
}

// ===== ОБНОВЛЕНИЕ СТАТИСТИКИ =====
function updateStats() {
    const codes = getCodes();
    document.getElementById('statTotalCodes').textContent = codes.length;
    document.getElementById('statActiveCodes').textContent = codes.filter(c => c.status === 'active').length;

    const allUsers = getAllUsersData();
    document.getElementById('statTotalUsers').textContent = allUsers.length;
    document.getElementById('statProUsers').textContent = allUsers.filter(u => u.userData.isPro).length;
}

// ===== ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ =====
renderCodes();
renderUsersTable(false); // Загружаем вкладку пользователей по умолчанию (скрыто, но готово)
renderUsersTable(true);  // Загружаем вкладку оплаченных
updateStats();
</script>
</body>
</html>
