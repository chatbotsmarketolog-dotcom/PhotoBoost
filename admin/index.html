<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель — PhotoBoost</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, sans-serif; background: #0a0a1a; color: #f8fafc; padding: 40px 20px; }
.container { max-width: 900px; margin: 0 auto; }
h1 { font-size: 2rem; margin-bottom: 30px; }
h2 { font-size: 1.3rem; margin: 30px 0 16px; }
.card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
.generate-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.generate-row input { width: 100px; padding: 12px; border: 2px solid rgba(255,255,255,0.2); border-radius: 10px; background: rgba(255,255,255,0.05); color: white; font-size: 1rem; }
.btn { padding: 12px 24px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; font-size: 0.95rem; font-family: inherit; }
.btn-primary { background: #7c3aed; color: white; }
.btn-primary:hover { background: #6d28d9; }
.btn-danger { background: #ef4444; color: white; }
.btn-danger:hover { background: #dc2626; }
.btn-secondary { background: rgba(255,255,255,0.1); color: white; }
.code-list { margin-top: 20px; }
.code-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 8px; }
.code-item.used { opacity: 0.5; }
.code-item code { font-family: monospace; font-size: 1.1rem; color: #10b981; }
.code-item.used code { color: #64748b; text-decoration: line-through; }
.status-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
.status-active { background: rgba(16,185,129,0.2); color: #10b981; }
.status-used { background: rgba(100,116,139,0.2); color: #64748b; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
.stat { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 12px; text-align: center; }
.stat-value { font-size: 2rem; font-weight: 800; color: #fbbf24; }
.stat-label { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }
@media (max-width: 640px) { .stats { grid-template-columns: 1fr; } .generate-row { flex-direction: column; } .generate-row input { width: 100%; } }
</style>
</head>
<body>
<div class="container">
<h1>🔐 Админ-панель PhotoBoost</h1>

<div class="stats">
<div class="stat"><div class="stat-value" id="totalCodes">0</div><div class="stat-label">Всего кодов</div></div>
<div class="stat"><div class="stat-value" id="activeCodes">0</div><div class="stat-label">Активных</div></div>
<div class="stat"><div class="stat-value" id="usedCodes">0</div><div class="stat-label">Использовано</div></div>
</div>

<div class="card">
<h2>➕ Генерация кодов</h2>
<div class="generate-row">
<input type="number" id="codeCount" value="10" min="1" max="100" placeholder="Количество">
<button class="btn btn-primary" onclick="generateCodes()">Сгенерировать</button>
<button class="btn btn-danger" onclick="clearAllCodes()">Очистить все коды</button>
</div>
</div>

<div class="card">
<h2> Список кодов</h2>
<div class="code-list" id="codeList"></div>
</div>
</div>

<script>
function getCodes() { return JSON.parse(localStorage.getItem('pbValidCodes') || '[]'); }
function saveCodes(codes) { localStorage.setItem('pbValidCodes', JSON.stringify(codes)); }

function generateCode() {
const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
let code = 'WB-';
for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
code += '-';
for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
return code;
}

function generateCodes() {
const count = parseInt(document.getElementById('codeCount').value) || 10;
const codes = getCodes();
for (let i = 0; i < count; i++) {
codes.push({ code: generateCode(), status: 'active', usedBy: null, usedAt: null, createdAt: new Date().toISOString() });
}
saveCodes(codes);
renderCodes();
updateStats();
alert('✅ Сгенерировано ' + count + ' кодов');
}

function clearAllCodes() {
if (!confirm('Удалить ВСЕ коды? Это действие нельзя отменить.')) return;
localStorage.removeItem('pbValidCodes');
renderCodes();
updateStats();
}

function renderCodes() {
const codes = getCodes();
const list = document.getElementById('codeList');
if (codes.length === 0) {
list.innerHTML = '<p style="color: #64748b;">Нет сгенерированных кодов</p>';
return;
}
list.innerHTML = codes.map((c, i) => `
<div class="code-item ${c.status === 'used' ? 'used' : ''}">
<code>${c.code}</code>
<span class="status-badge ${c.status === 'active' ? 'status-active' : 'status-used'}">
${c.status === 'active' ? 'Активен' : 'Использован' + (c.usedBy ? ' (' + c.usedBy + ')' : '')}
</span>
<button class="btn btn-danger" onclick="deleteCode(${i})">Удалить</button>
</div>
`).join('');
}

function deleteCode(index) {
if (!confirm('Удалить этот код?')) return;
const codes = getCodes();
codes.splice(index, 1);
saveCodes(codes);
renderCodes();
updateStats();
}

function updateStats() {
const codes = getCodes();
document.getElementById('totalCodes').textContent = codes.length;
document.getElementById('activeCodes').textContent = codes.filter(c => c.status === 'active').length;
document.getElementById('usedCodes').textContent = codes.filter(c => c.status === 'used').length;
}

renderCodes();
updateStats();
</script>
</body>
</html>
