<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhotoBoost PRO — Оптимизатор фото</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --bg-dark: #0a0a1a; --bg-light: #faf9ff; --primary: #7c3aed; --gold: #fbbf24; --success: #10b981; --text-dark: #0f0f1e; --text-light: #f8fafc; --text-muted: #64748b; --border: rgba(255,255,255,0.1); --gradient-purple: linear-gradient(135deg,#7c3aed 0%,#ec4899 100%); --gradient-gold: linear-gradient(135deg,#fbbf24 0%,#f59e0b 100%); }
body { font-family: -apple-system, sans-serif; background: var(--bg-light); color: var(--text-dark); line-height: 1.6; }
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(10,10,26,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
.nav-container { max-width: 1280px; margin: 0 auto; padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; }
.logo { display: flex; align-items: center; gap: 10px; font-size: 1.4rem; font-weight: 800; color: var(--text-light); text-decoration: none; }
.logo-icon { width: 38px; height: 38px; background: var(--gradient-purple); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.logo span { background: var(--gradient-purple); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.nav-actions { display: flex; gap: 10px; align-items: center; }
.btn { padding: 11px 22px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; transition: 0.3s; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; }
.btn-ghost { background: transparent; color: var(--text-light); border: 1px solid var(--border); }
.btn-primary { background: var(--gradient-purple); color: white; }
.btn-gold { background: var(--gradient-gold); color: var(--text-dark); }
.btn-large { padding: 16px 36px; font-size: 1.05rem; border-radius: 12px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.user-badge { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; background: rgba(255,255,255,0.05); border-radius: 50px; cursor: pointer; border: 1px solid var(--border); }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--gradient-purple); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; overflow: hidden; }
.user-avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-name { color: var(--text-light); font-weight: 600; font-size: 0.9rem; }
.hero { background: var(--bg-dark); color: var(--text-light); padding: 140px 20px 100px; text-align: center; }
.hero h1 { font-size: 3rem; font-weight: 800; margin-bottom: 20px; }
.hero p { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px; }
.section { padding: 80px 20px; }
.section-container { max-width: 1000px; margin: 0 auto; }
.tool-wrapper { background: white; border-radius: 20px; padding: 40px; border: 1px solid #e2e8f0; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
.upload-zone { border: 2px dashed #cbd5e1; border-radius: 16px; padding: 40px; text-align: center; cursor: pointer; background: #faf9ff; margin-bottom: 24px; transition: 0.3s; }
.upload-zone:hover { border-color: var(--primary); background: #f3f0ff; }
.settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.setting-item label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
.setting-item select, .setting-item input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-family: inherit; }
.setting-item.disabled { opacity: 0.5; pointer-events: none; }
.pro-lock { font-size: 0.75rem; color: var(--gold); font-weight: 600; margin-left: 6px; }
.action-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: #faf9ff; border-radius: 12px; margin-bottom: 24px; flex-wrap: wrap; gap: 15px; }
.results-area { margin-top: 24px; }
.result-item { background: #faf9ff; padding: 16px; border-radius: 12px; margin-bottom: 12px; display: flex; gap: 16px; align-items: center; border: 1px solid #e2e8f0; flex-wrap: wrap; }
.result-preview { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; }
.result-info { flex: 1; }
.result-info h4 { margin-bottom: 8px; font-size: 0.95rem; }
.result-metrics { display: flex; gap: 16px; font-size: 0.85rem; flex-wrap: wrap; }
.metric-value { font-weight: 700; color: var(--success); }
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
.modal-overlay.active { display: flex; }
.modal { background: white; border-radius: 20px; max-width: 500px; width: 100%; padding: 30px; position: relative; }
.modal-close { position: absolute; top: 15px; right: 15px; width: 32px; height: 32px; border-radius: 50%; background: #f1f5f9; border: none; cursor: pointer; font-size: 1.2rem; }
.form-group { margin-bottom: 16px; }
.form-input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-family: inherit; }
@media (max-width: 600px) { .hero h1 { font-size: 2rem; } .result-item { flex-direction: column; text-align: center; } .result-metrics { justify-content: center; } }
</style>
</head>
<body>
<nav class="nav">
<div class="nav-container">
<a href="./" class="logo"><div class="logo-icon">📸</div><div>Photo<span>Boost</span></div></a>
<div class="nav-actions" id="navActions"></div>
</div>
</nav>

<section class="hero">
<h1>Оптимизатор фото для маркетплейсов</h1>
<p>Автоматическая обрезка и сжатие под Wildberries, Ozon и Avito</p>
<button class="btn btn-primary btn-large" onclick="document.getElementById('tool').scrollIntoView({behavior:'smooth'})">Попробовать бесплатно</button>
</section>

<section class="section" id="tool">
<div class="section-container">
<div class="tool-wrapper">
<div class="upload-zone" id="uploadZone">
<p>📸 Нажмите или перетащите фото сюда</p>
<input type="file" id="fileInput" accept="image/*" multiple style="display:none;">
</div>
<div class="settings-grid">
<div class="setting-item"><label>Маркетплейс</label><select id="marketplace"><option value="wb">Wildberries (900×1200)</option><option value="ozon">Ozon (900×1200)</option><option value="avito">Avito (1200×900)</option></select></div>
<div class="setting-item"><label>Качество</label><select id="quality"><option value="high">Высокое</option><option value="medium" selected>Среднее</option><option value="low">Низкое</option></select></div>
<div class="setting-item"><label>Макс. размер</label><select id="maxSize"><option value="100" selected>100 КБ</option><option value="200">200 КБ</option><option value="500">500 КБ</option></select></div>
<div class="setting-item" id="formatSetting"><label>Формат <span class="pro-lock">🔒 PRO</span></label><select id="outputFormat" disabled><option value="jpg">JPG</option><option value="png">PNG</option><option value="webp">WebP</option></select></div>
<div class="setting-item" id="watermarkSetting"><label>Водяной знак <span class="pro-lock">🔒 PRO</span></label><input type="text" id="watermarkText" placeholder="Текст" disabled></div>
</div>
<div class="action-bar">
<span id="statusText">Бесплатно: <strong>2</strong> фото</span>
<button class="btn btn-primary" id="processBtn" disabled>Обработать фото</button>
</div>
<div class="results-area" id="resultsArea"></div>
<button class="btn btn-gold btn-large" id="downloadAllBtn" style="width:100%; margin-top:16px; display:none;">📦 Скачать всё архивом (ZIP)</button>
</div>
</div>
</section>

<!-- МОДАЛКА ВХОДА/РЕГИСТРАЦИИ -->
<div class="modal-overlay" id="authModal">
<div class="modal">
<button class="modal-close" onclick="closeModal('authModal')">✕</button>
<h2 style="text-align:center; margin-bottom:20px;">Вход / Регистрация</div>
<div class="form-group"><input type="text" class="form-input" id="authName" placeholder="Ваше имя"></div>
<div class="form-group"><input type="email" class="form-input" id="authEmail" placeholder="Email"></div>
<div class="form-group"><input type="password" class="form-input" id="authPassword" placeholder="Пароль"></div>
<button class="btn btn-primary" style="width:100%" onclick="handleAuth()">Войти / Создать аккаунт</button>
<p style="text-align:center; margin-top:16px; font-size:0.9rem; color:var(--text-muted);">
<a href="dashboard/" style="color:var(--primary); text-decoration:none;">Перейти в Личный кабинет →</a>
</p>
</div>
</div>

<!-- МОДАЛКА АКТИВАЦИИ КОДА -->
<div class="modal-overlay" id="codeModal">
<div class="modal">
<button class="modal-close" onclick="closeModal('codeModal')">✕</button>
<h2 style="text-align:center; margin-bottom:20px;">Активация PRO</h2>
<div class="form-group"><input type="text" class="form-input" id="activationCode" placeholder="Введите код (например, WB-XXXX-XXXX)" style="text-transform:uppercase; text-align:center; font-weight:700;"></div>
<button class="btn btn-primary" style="width:100%" onclick="activateByCode()">Активировать</button>
<p style="text-align:center; margin-top:16px; font-size:0.9rem; color:var(--text-muted);">
<a href="dashboard/" style="color:var(--primary); text-decoration:none;">Перейти в Личный кабинет для активации →</a>
</p>
</div>
</div>

<script>
let state = {
  user: JSON.parse(localStorage.getItem('pbUser')) || null,
  freeUsage: parseInt(localStorage.getItem('pbFreeUsage')) || 2,
  isPro: localStorage.getItem('pbIsPro') === 'true',
  selectedFiles: [],
  processedFiles: []
};

// 1. НАВИГАЦИЯ
function updateNav() {
  const a = document.getElementById('navActions');
  if (state.user) {
    const avatarHtml = state.user.avatar ? `<img src="${state.user.avatar}">` : state.user.name.charAt(0).toUpperCase();
    a.innerHTML = `<div class="user-badge" onclick="location.href='dashboard/'"><div class="user-avatar">${avatarHtml}</div><div class="user-name">${state.user.name.split(' ')[0]}</div></div>`;
  } else {
    a.innerHTML = `<button class="btn btn-primary" onclick="openModal('authModal')">Войти</button>`;
  }
  document.getElementById('statusText').innerHTML = state.isPro ? '<strong style="color:#10b981;">⭐ PRO активен</strong>' : `Бесплатно: <strong>${state.freeUsage}</strong> фото`;
  document.getElementById('processBtn').disabled = state.selectedFiles.length === 0 || (!state.isPro && state.freeUsage <= 0);
  
  const proSettings = ['formatSetting', 'watermarkSetting'];
  proSettings.forEach(id => {
    const el = document.getElementById(id);
    const input = el.querySelector('select, input');
    if (state.isPro) { el.classList.remove('disabled'); input.disabled = false; } 
    else { el.classList.add('disabled'); input.disabled = true; }
  });
}

function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

// 2. АВТОРИЗАЦИЯ (Упрощенная, без лишних кнопок)
function handleAuth() {
  const name = document.getElementById('authName').value || 'Пользователь';
  const email = document.getElementById('authEmail').value;
  const password = document.getElementById('authPassword').value;
  if (!email || !password) { alert('Введите email и пароль'); return; }
  
  const users = JSON.parse(localStorage.getItem('pbUsers') || '[]');
  let user = users.find(u => u.email === email);
  
  if (user && user.password === password) {
    state.user = user;
  } else if (!user) {
    user = { name, email, password, registeredAt: new Date().toISOString() };
    users.push(user);
    state.user = user;
  } else {
    alert('Неверный пароль');
    return;
  }
  
  localStorage.setItem('pbUsers', JSON.stringify(users));
  localStorage.setItem('pbUser', JSON.stringify(state.user));
  closeModal('authModal');
  updateNav();
  alert('✅ Добро пожаловать!');
}

// 3. ЗАГРУЗКА ФАЙЛОВ
const zone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
zone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => handleFiles(e.target.files));

function handleFiles(files) {
  const all = Array.from(files).filter(f => f.type.startsWith('image/'));
  if (!all.length) return;
  state.selectedFiles = all;
  zone.innerHTML = `<p>✅ Выбрано файлов: ${state.selectedFiles.length}</p>`;
  updateNav();
}

// 4. ОБРАБОТКА (УЛУЧШЕННОЕ КАЧЕСТВО)
document.getElementById('processBtn').addEventListener('click', async () => {
  if (!state.selectedFiles.length) return;
  if (!state.isPro && state.freeUsage <= 0) { openModal('codeModal'); return; }
  
  const btn = document.getElementById('processBtn');
  btn.disabled = true; btn.textContent = 'Обработка...';
  document.getElementById('resultsArea').innerHTML = '';
  state.processedFiles = [];
  
  const settings = {
    marketplace: document.getElementById('marketplace').value,
    quality: document.getElementById('quality').value,
    maxSize: parseInt(document.getElementById('maxSize').value),
    outputFormat: state.isPro ? document.getElementById('outputFormat').value : 'jpg',
    watermark: state.isPro ? document.getElementById('watermarkText').value : ''
  };

  for (const f of state.selectedFiles) {
    const r = await processImage(f, settings);
    state.processedFiles.push(r);
    displayResult(r, state.processedFiles.length - 1);
  }
  
  if (!state.isPro) {
    state.freeUsage = Math.max(0, state.freeUsage - state.selectedFiles.length);
    localStorage.setItem('pbFreeUsage', state.freeUsage);
  }
  
  btn.disabled = false; btn.textContent = 'Обработать фото';
  if (state.processedFiles.length > 1) document.getElementById('downloadAllBtn').style.display = 'block';
  updateNav();
});

async function processImage(file, s) {
  return new Promise(res => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        let W = 900, H = 1200;
        if (s.marketplace === 'avito') { W = 1200; H = 900; }
        
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        const ctx = c.getContext('2d');
        
        // ✅ УЛУЧШЕНИЕ КАЧЕСТВА: включаем сглаживание высокого качества
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        
        const sc = Math.max(W / img.width, H / img.height);
        ctx.drawImage(img, (W/2)-(img.width/2)*sc, (H/2)-(img.height/2)*sc, img.width*sc, img.height*sc);
        
        if (s.watermark) {
          ctx.font = 'bold 24px Arial';
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
          ctx.fillText(s.watermark, W-20, H-20);
        }
        
        let q = s.quality === 'high' ? 0.92 : s.quality === 'low' ? 0.6 : 0.75; // ✅ Более высокие стартовые значения качества
        let mime = 'image/jpeg', ext = 'jpg';
        if (s.outputFormat === 'png') { mime = 'image/png'; ext = 'png'; } 
        else if (s.outputFormat === 'webp') { mime = 'image/webp'; ext = 'webp'; }
        
        let url = c.toDataURL(mime, q); 
        let size = url.length * 0.75;
        
        while (size > s.maxSize * 1024 && q > 0.1 && ext !== 'png') { 
          q -= 0.05; 
          url = c.toDataURL(mime, q); 
          size = url.length * 0.75; 
        }
        res({ originalName: file.name, originalSize: file.size, optimizedData: url, optimizedSize: size, ext });
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function displayResult(r, i) {
  const sv = ((1 - r.optimizedSize / r.originalSize) * 100).toFixed(1);
  const d = document.createElement('div'); d.className = 'result-item';
  d.innerHTML = `<img src="${r.optimizedData}" class="result-preview"><div class="result-info"><h4>${r.originalName}</h4><div class="result-metrics"><span class="metric-value">${(r.originalSize/1024).toFixed(1)} → ${(r.optimizedSize/1024).toFixed(1)} КБ</span> <span class="metric-value">(-${sv}%)</span></div></div><button class="btn btn-primary" onclick="downloadFile(${i})">Скачать</button>`;
  document.getElementById('resultsArea').appendChild(d);
}

function downloadFile(i) {
  const r = state.processedFiles[i];
  const a = document.createElement('a');
  a.download = 'optimized_' + r.originalName.replace(/\.[^/.]+$/, '') + '.' + r.ext;
  a.href = r.optimizedData;
  a.click();
}

// 5. ✅ ZIP СКАЧИВАЕТ ВСЕ ФАЙЛЫ
document.getElementById('downloadAllBtn').addEventListener('click', async () => {
  if (!state.isPro) { openModal('codeModal'); return; }
  const zip = new JSZip();
  // Проходим по ВСЕМ обработанным файлам
  state.processedFiles.forEach((r, i) => {
    const base64 = r.optimizedData.split(',')[1];
    const name = 'optimized_' + r.originalName.replace(/\.[^/.]+$/, '') + '_' + (i+1) + '.' + r.ext;
    zip.file(name, base64, { base64: true });
  });
  const blob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.download = 'photoboost_all_files.zip';
  a.href = URL.createObjectURL(blob);
  a.click();
});

// 6. ✅ ПРОВЕРКА КОДА ПО СПИСКУ ИЗ "АДМИНКИ"
function activateByCode() {
  const input = document.getElementById('activationCode');
  if (!input) return;
  const code = input.value.trim().toUpperCase();
  
  if (!/^WB-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(code)) { 
    alert('❌ Неверный формат. Пример: WB-A1B2-C3D4'); 
    return; 
  }
  
  // ✅ Получаем список валидных кодов из "админки" (localStorage)
  const validCodes = JSON.parse(localStorage.getItem('pbValidCodes') || '[]');
  
  if (validCodes.length === 0) {
    alert('⚠️ Список кодов пуст. Обратитесь к администратору.');
    return;
  }
  
  if (!validCodes.includes(code)) {
    alert('❌ Код не найден в списке валидных. Проверьте правильность.');
    return;
  }
  
  if (state.isPro) {
    alert('⚠️ У вас уже активен PRO.');
    return;
  }

  // ✅ Удаляем использованный код из списка, чтобы его нельзя было использовать снова
  const updatedCodes = validCodes.filter(c => c !== code);
  localStorage.setItem('pbValidCodes', JSON.stringify(updatedCodes));
  
  state.isPro = true;
  const exp = new Date();
  exp.setMonth(exp.getMonth() + 1);
  localStorage.setItem('pbIsPro', 'true');
  localStorage.setItem('pbProExpiry', exp.toISOString());
  
  input.value = '';
  closeModal('codeModal');
  updateNav();
  alert('🎉 PRO успешно активирован до ' + new Date(exp).toLocaleDateString('ru-RU') + '!');
}

updateNav();
</script>
</body>
</html>
